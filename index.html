<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITN Household Registration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1b6499">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ITN HHR">
<style>
  :root{
    --sky-50:#f2f8fd; --sky-100:#e3f1fb; --sky-200:#c9e4f7; --sky-300:#9ed0f0;
    --sky-400:#6ab6e6; --sky-500:#3d9ad6; --sky-600:#2680bd; --sky-700:#1b6499;
    --ink:#14344d; --muted:#5f7f96; --line:#dceaf5; --white:#fff;
    --ok:#2aa17c; --ok-bg:#e6f6f1; --bad:#d95468; --bad-bg:#fceaed;
    --warn:#e0a100; --warn-bg:#fff7e0;
    --sh-sm:0 2px 8px rgba(38,128,189,.08);
    --sh-md:0 10px 30px rgba(38,128,189,.14);
    --sh-lg:0 26px 60px rgba(38,128,189,.22);
    --disp:'Oswald',system-ui,sans-serif; --body:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{font-family:var(--body);color:var(--ink);background:var(--sky-50);
    display:flex;align-items:center;justify-content:center;
    padding:clamp(0px,2vmin,22px);min-height:100vh;min-height:100dvh;}
  .phone{width:min(100%,clamp(360px,44vh,470px));
    height:96vh;height:96dvh;max-height:940px;
    background:#0c2740;border-radius:clamp(28px,4vh,46px);padding:clamp(6px,1vh,12px);
    box-shadow:var(--sh-lg);}
  .screen{position:relative;width:100%;height:100%;background:var(--white);
    border-radius:clamp(20px,3vh,36px);overflow:hidden;}
  #app{position:absolute;inset:0;display:flex;flex-direction:column;}
  @media (max-width:700px),(max-height:620px){
    body{padding:0;min-height:100vh;min-height:100dvh;}
    .phone{width:100%;max-width:none;height:100vh;height:100dvh;max-height:none;border-radius:0;padding:0;}
    .screen{border-radius:0;}
  }
  @media (min-width:1100px) and (min-height:1000px){
    .phone{width:min(100%,520px);}
  }

  .appbar{flex:0 0 auto;background:var(--sky-100);color:var(--sky-700);padding:15px 16px 13px;display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--sky-200);}
  @supports (padding-top: env(safe-area-inset-top)){
    .appbar{padding-top:calc(15px + env(safe-area-inset-top));}
    .footer{padding-bottom:calc(13px + env(safe-area-inset-bottom));}
  }
  .ico-btn{width:38px;height:38px;border:none;border-radius:12px;background:var(--white);color:var(--sky-600);display:grid;place-items:center;cursor:pointer;box-shadow:var(--sh-sm);flex:0 0 auto;}
  .ico-btn:active{transform:scale(.94);}
  .titles{min-width:0;flex:1;}
  .eyebrow{font:600 10px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;color:var(--sky-500);}
  .title{font:600 16.5px/1.15 var(--disp);letter-spacing:.02em;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tag-pill{font:700 9.5px/1 var(--body);letter-spacing:.06em;padding:6px 8px;border-radius:7px;flex:0 0 auto;}
  .tag-pill.me{background:var(--sky-600);color:#fff;}

  .body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .footer{flex:0 0 auto;background:var(--sky-100);border-top:1px solid var(--sky-200);padding:13px 16px calc(15px + env(safe-area-inset-bottom));display:flex;gap:10px;}

  .btn{font:600 15px/1 var(--body);border:none;border-radius:14px;padding:15px 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .08s,box-shadow .2s;}
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--sky-600);color:#fff;box-shadow:0 6px 16px rgba(38,128,189,.3);flex:1;}
  .btn-primary:disabled{background:var(--sky-200);color:#fff;box-shadow:none;cursor:not-allowed;}
  .btn-ghost{background:var(--white);color:var(--sky-600);box-shadow:var(--sh-sm);}
  .btn-ok{background:var(--ok);color:#fff;box-shadow:0 6px 16px rgba(42,161,124,.28);flex:1;}
  .btn-danger{background:var(--bad-bg);color:var(--bad);box-shadow:none;}
  .btn-block{width:100%;}
  .btn-sm{padding:12px 14px;font-size:13.5px;}

  .hero{background:linear-gradient(160deg,var(--sky-500),var(--sky-700));color:#fff;padding:26px 22px 30px;border-bottom-left-radius:30px;border-bottom-right-radius:30px;position:relative;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;background:rgba(255,255,255,.10);}
  .hero h1{font:600 23px/1.18 var(--disp);margin:0 0 8px;position:relative;}
  .hero p{font:400 12.5px/1.5 var(--body);color:rgba(255,255,255,.9);max-width:32ch;position:relative;}

  .list{padding:18px 16px 28px;}
  .list h2{font:600 20px/1.1 var(--disp);}
  .sub{font:400 12px/1.45 var(--body);color:var(--muted);margin:6px 0 14px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:var(--sh-sm);}
  .field{margin-bottom:11px;}
  .lbl{font:600 11px var(--body);color:var(--muted);margin-bottom:6px;letter-spacing:.02em;}
  .field input{width:100%;font:500 15px var(--body);color:var(--ink);padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);outline:none;transition:.15s;}
  .field input:focus{border-color:var(--sky-500);box-shadow:0 0 0 3px rgba(61,154,214,.13);}
  .flag{font:500 11.5px/1.4 var(--body);padding:9px 11px;border-radius:10px;margin-bottom:11px;}
  .flag.bad{background:var(--bad-bg);color:var(--bad);border:1px solid #f2ccd2;}
  .flag.ok{background:var(--ok-bg);color:var(--ok);border:1px solid #bfe6d6;}
  .note{font:400 11.5px/1.5 var(--body);color:var(--sky-700);background:var(--sky-50);border:1px dashed var(--sky-300);border-radius:10px;padding:10px 12px;margin-bottom:13px;}

  .grid{display:grid;gap:10px;}
  .grid.g1{grid-template-columns:1fr;}
  .grid.g2{grid-template-columns:1fr 1fr;}
  .grid.g3{grid-template-columns:1fr 1fr 1fr;}
  .grid.g4{grid-template-columns:repeat(auto-fill,minmax(72px,1fr));}

  .tile{position:relative;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 11px;box-shadow:var(--sh-sm);text-align:left;cursor:pointer;transition:transform .12s,box-shadow .2s,border-color .15s;}
  .tile:active{transform:scale(.98);}
  .tile .tn{font:700 14px/1 var(--disp);letter-spacing:.03em;color:var(--ink);}
  .tile .tb{font:700 8.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;padding:5px 6px;border-radius:99px;}
  .tile .top{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:9px;}
  .tile .tk{font:500 10px/1.3 var(--body);color:var(--muted);}
  .tile .tn.small{font-size:12.5px;line-height:1.2;letter-spacing:.01em;}
  .tile .tb.code{background:var(--sky-50);border:1px solid var(--sky-200);color:var(--sky-700);font-family:var(--disp);letter-spacing:.05em;}
  .crumb{font:500 10.5px/1.4 var(--body);color:var(--muted);margin:0 2px 10px;}
  .crumb .cs{color:var(--sky-300);margin:0 6px;}
  .tile .ttrack{height:6px;background:var(--sky-50);border:1px solid var(--line);border-radius:99px;overflow:hidden;margin-top:8px;}
  .tile .tfill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky-400),var(--sky-600));}
  .tile .tfill.full{background:var(--ok);}

  .tile.done{border-color:var(--ok);background:var(--ok-bg);}
  .tile.done .tb{background:var(--ok);color:#fff;}
  .tile.done .tn{color:#16744f;}
  .tile.todo{border-color:var(--bad);background:var(--bad-bg);}
  .tile.todo .tb{background:var(--bad);color:#fff;}
  .tile.todo .tn{color:#a33648;}
  .tile.next{box-shadow:0 0 0 3px rgba(217,84,104,.18),var(--sh-sm);}
  .tile.locked{cursor:not-allowed;opacity:.5;}
  .tile.locked .tb{background:#eef2f5;color:var(--muted);}

  .hh{aspect-ratio:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;}
  .hh .hn{font:700 19px/1 var(--disp);letter-spacing:.02em;}
  .hh .hs{font:700 7.5px/1 var(--body);letter-spacing:.05em;text-transform:uppercase;}
  .hh.done .hn,.hh.done .hs{color:#16744f;}
  .hh.todo .hn,.hh.todo .hs{color:#a33648;}
  .hh.locked .hn,.hh.locked .hs{color:var(--muted);}
  .tile.revisit{border-color:var(--warn);background:var(--warn-bg);}
  .tile.revisit .tb{background:var(--warn);color:#fff;}
  .tile.revisit .tn{color:#8a6d00;}
  .hh.revisit .hn,.hh.revisit .hs{color:#8a6d00;}
  .hh .pend{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn);
    box-shadow:0 0 0 2px #fff;}

  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:0 2px 13px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--body);color:var(--muted);}
  .legend i{width:11px;height:11px;border-radius:4px;border:1px solid;display:inline-block;}
  .legend i.d{background:var(--ok-bg);border-color:var(--ok);}
  .legend i.t{background:var(--bad-bg);border-color:var(--bad);}
  .legend i.l{background:#f1f4f7;border-color:#cfd8e0;}
  .legend i.r{background:var(--warn-bg);border-color:var(--warn);}
  .legend i.mg{background:var(--ok);border-color:var(--ok);}
  .legend i.my{background:var(--warn);border-color:var(--warn);}
  .legend i.s{background:var(--white);border-color:var(--ink);border-width:2px;}
  .legend i.tk{background:var(--muted);border-color:var(--muted);height:3px;border-radius:2px;}
  .legend i.tg{background:transparent;border:none;height:0;border-top:2px dashed #98adbd;border-radius:0;}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:15px;}
  .stat{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:14px;box-shadow:var(--sh-sm);}
  .stat .n{font:700 25px/1 var(--disp);color:var(--sky-600);}
  .stat .n.g{color:var(--ok);} .stat .n.r{color:var(--bad);}
  .stat .l{font:500 11px/1.3 var(--body);color:var(--muted);margin-top:6px;}

  .hd-head{background:linear-gradient(160deg,var(--sky-500),var(--sky-700));color:#fff;border-radius:16px;padding:16px;margin-bottom:14px;}
  .hd-head .id{font:700 20px var(--disp);letter-spacing:.04em;}
  .hd-head .meta{font:400 11.5px/1.5 var(--body);opacity:.92;margin-top:5px;}

  .q-card{background:var(--white);border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:11px;box-shadow:var(--sh-sm);scroll-margin-top:14px;}
  .q-card.missing{border-color:var(--bad);box-shadow:0 0 0 3px rgba(217,84,104,.13);}
  .q-no{display:inline-block;font:700 10px/1 var(--body);letter-spacing:.08em;color:var(--sky-600);background:var(--sky-50);border:1px solid var(--sky-200);padding:5px 8px;border-radius:6px;margin-bottom:9px;}
  .q-txt{font:500 15px/1.32 var(--body);color:var(--ink);margin-bottom:4px;}
  .q-txt .req{color:var(--bad);margin-left:2px;}
  .q-help{font:400 11.5px/1.45 var(--body);color:var(--muted);margin-bottom:10px;}
  .q-card .q-txt+.opts,.q-card .q-txt+.field{margin-top:11px;}
  .opts{display:flex;gap:8px;}
  .opt{flex:1;display:flex;align-items:center;justify-content:center;gap:9px;padding:13px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--white);cursor:pointer;font:600 14px/1.2 var(--body);color:var(--ink);transition:.13s;}
  .opt .mark{width:18px;height:18px;border-radius:50%;border:2px solid var(--sky-200);flex:0 0 auto;display:grid;place-items:center;}
  .opt .mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--sky-600);transform:scale(0);transition:transform .15s;}
  .opt.sel .mark::after{transform:scale(1);}
  .opt.yes.sel{border-color:var(--ok);background:var(--ok-bg);box-shadow:0 0 0 3px rgba(42,161,124,.12);}
  .opt.yes.sel .mark{border-color:var(--ok);} .opt.yes.sel .mark::after{background:var(--ok);}
  .opt.no.sel{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 0 0 3px rgba(217,84,104,.12);}
  .opt.no.sel .mark{border-color:var(--bad);} .opt.no.sel .mark::after{background:var(--bad);}
  .field input[readonly]{background:var(--sky-50);font-family:var(--disp);letter-spacing:.05em;color:var(--sky-700);font-size:17px;}
  .field .calc{font-family:var(--disp);letter-spacing:.04em;color:var(--sky-700);}
  .unit{position:relative;}
  .unit .u{position:absolute;right:13px;top:50%;transform:translateY(-50%);font:600 12px var(--body);color:var(--muted);pointer-events:none;}
  .unit input{padding-right:64px;}
  .err{font:500 11.5px/1.4 var(--body);color:var(--bad);margin-top:8px;}
  .gps-diag{font:500 9.5px/1.4 var(--body);color:var(--muted);margin-top:9px;word-break:break-word;
    background:#f4f6f8;border:1px solid #e3e9ee;border-radius:8px;padding:7px 9px;}
  .tok-show{font:700 26px/1.1 var(--disp);letter-spacing:.06em;color:var(--sky-700);background:var(--sky-50);border:1.5px dashed var(--sky-300);border-radius:12px;padding:14px;text-align:center;word-break:break-all;}

  .rv-item{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .rv-item:last-child{border-bottom:none;}
  .rv-item .q{font:400 12px/1.35 var(--body);color:var(--muted);flex:1;}
  .rv-item .a{font:600 12.5px/1.35 var(--body);color:var(--ink);text-align:right;flex:0 0 46%;word-break:break-word;}

  .menu-card{position:relative;display:flex;align-items:center;gap:15px;width:100%;text-align:left;
    background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:13px;
    cursor:pointer;box-shadow:var(--sh-sm);overflow:hidden;transition:transform .12s,box-shadow .2s;}
  .menu-card:active{transform:scale(.985);}
  .menu-card:hover{box-shadow:var(--sh-md);}
  .menu-card .mi{position:relative;width:54px;height:54px;border-radius:17px;display:grid;place-items:center;flex:0 0 auto;}
  .menu-card .mi.b{background:var(--sky-100);color:var(--sky-600);}
  .menu-card .mi.g{background:var(--ok-bg);color:var(--ok);}
  .menu-card .mi.y{background:var(--warn-bg);color:#b8860b;}
  .menu-card .mi.s{background:#eaf0f5;color:var(--muted);}
  .menu-card .mt{position:relative;flex:1;min-width:0;}
  .menu-card .mt h3{font:600 17.5px/1.1 var(--disp);letter-spacing:.01em;margin-bottom:4px;}
  .menu-card .mt span{font:400 12px/1.45 var(--body);color:var(--muted);display:block;}
  .menu-card .mt .mm{font:600 10.5px/1 var(--body);letter-spacing:.04em;color:var(--sky-600);margin-top:9px;display:inline-block;
    background:var(--sky-50);border:1px solid var(--sky-200);border-radius:99px;padding:6px 9px;}
  .menu-card .ma{position:relative;color:var(--sky-300);flex:0 0 auto;}

  .daybar{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;margin-bottom:12px;-webkit-overflow-scrolling:touch;}
  .daybar button{flex:0 0 auto;border:1.5px solid var(--sky-200);background:var(--white);color:var(--sky-700);
    border-radius:10px;padding:9px 12px;font:600 12px/1 var(--body);cursor:pointer;}
  .daybar button.on{background:var(--sky-600);border-color:var(--sky-600);color:#fff;}
  .daybar button:disabled{opacity:.42;cursor:not-allowed;}
  #map,#amap{height:clamp(240px,38vh,460px);border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--sky-50);box-shadow:var(--sh-sm);}
  .mk{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 7px;border-radius:99px;
    background:var(--sky-600);color:#fff;font:700 11px/1 'Oswald',sans-serif;letter-spacing:.02em;
    border:2px solid #fff;box-shadow:0 2px 6px rgba(12,39,64,.35);white-space:nowrap;}
  .mk.multi{font-size:10px;letter-spacing:.04em;}
  .mk.reg{background:var(--ok);}
  .mk.rev{background:var(--warn);color:#4a3b00;}
  .mk.start{box-shadow:0 0 0 3px rgba(20,52,77,.55),0 2px 6px rgba(12,39,64,.35);}
  .step-row .sn.multi{width:auto;min-width:26px;padding:0 6px;border-radius:99px;font-size:9.5px;}
  .step-row .sn.reg{background:var(--ok);}
  .step-row .sn.rev{background:var(--warn);color:#4a3b00;}
  .leaflet-container{font-family:var(--body);}
  .mpop{font:400 12px/1.5 var(--body);}
  .mpop b{font:600 12.5px var(--body);}
  .steps{max-height:none;}
  .step-row{display:flex;align-items:center;gap:11px;padding:9px 0;border-bottom:1px solid var(--line);}
  .step-row:last-child{border-bottom:none;}
  .step-row .sn{width:26px;height:26px;border-radius:50%;background:var(--sky-600);color:#fff;
    display:grid;place-items:center;font:700 11px/1 var(--disp);flex:0 0 auto;}
  .step-row .sn.first{background:var(--ok);} .step-row .sn.last{background:var(--bad);}
  .step-row .sm{flex:1;min-width:0;}
  .step-row .sm .t{font:600 12.5px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .step-row .sm .s{font:400 11px var(--body);color:var(--muted);margin-top:2px;}
  .step-row .sg{font:600 11px var(--body);color:var(--sky-600);flex:0 0 auto;}

  .ring-card{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:13px;box-shadow:var(--sh-sm);
    display:flex;align-items:center;gap:18px;}
  .ring-card .rw{flex:0 0 auto;position:relative;width:128px;height:128px;}
  .ring-card .rl{flex:1;min-width:0;}
  .ring-card .rl h4{font:600 13px var(--body);margin-bottom:10px;}
  .ring-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .ring-txt .p{font:700 27px/1 var(--disp);color:var(--sky-700);}
  .ring-txt .s{font:500 10px/1.2 var(--body);color:var(--muted);margin-top:3px;}
  .kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);}
  .kv:last-child{border-bottom:none;}
  .kv .k{font:400 11.5px var(--body);color:var(--muted);}
  .kv .v{font:600 12px var(--body);color:var(--ink);}
  .dayrow{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .dayrow .dl{font:600 10.5px/1 var(--body);color:var(--muted);width:42px;flex:0 0 auto;letter-spacing:.03em;}
  .dayrow .dt{flex:1;height:16px;background:var(--sky-50);border:1px solid var(--line);border-radius:99px;position:relative;overflow:hidden;}
  .dayrow .df{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--sky-400),var(--sky-600));}
  .dayrow .df.full{background:linear-gradient(90deg,#4cbf9a,var(--ok));}
  .dayrow .dp{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:repeating-linear-gradient(45deg,rgba(224,161,0,.85) 0 4px,rgba(224,161,0,.45) 4px 8px);}
  .dayrow .dv{font:600 11px/1 var(--body);color:var(--ink);width:52px;text-align:right;flex:0 0 auto;}
  .dayrow.locked{opacity:.45;}
  .achv-legend{display:flex;gap:14px;flex-wrap:wrap;margin:9px 2px 0;}
  .achv-legend span{display:inline-flex;align-items:center;gap:6px;font:500 10px/1 var(--body);color:var(--muted);}
  .achv-legend i{width:11px;height:8px;border-radius:3px;display:inline-block;}
  .achv-legend i.a{background:var(--sky-500);} .achv-legend i.f{background:var(--ok);}
  .achv-legend i.p{background:var(--warn);} .achv-legend i.t{background:var(--sky-50);border:1px solid var(--line);}
  .bigstat{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:13px;}
  .bigstat .b{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--sh-sm);}
  .bigstat .b .n{font:700 23px/1 var(--disp);color:var(--sky-600);}
  .bigstat .b .n.g{color:var(--ok);} .bigstat .b .n.w{color:#b8860b;} .bigstat .b .n.r{color:var(--bad);}
  .bigstat .b .l{font:500 10.5px/1.35 var(--body);color:var(--muted);margin-top:6px;}

  .sync-bar{display:flex;align-items:center;gap:10px;border-radius:14px;padding:12px 13px;margin-bottom:13px;border:1px solid;}
  .sync-bar .d{width:9px;height:9px;border-radius:50%;flex:0 0 auto;}
  .sync-bar .t{flex:1;font:400 11.5px/1.45 var(--body);}
  .sync-bar.ok{background:var(--ok-bg);border-color:#bfe6d6;color:#1a7a5e;}
  .sync-bar.ok .d{background:var(--ok);}
  .sync-bar.warn{background:var(--warn-bg);border-color:#f0dda0;color:#8a6d00;}
  .sync-bar.warn .d{background:var(--warn);}
  .sync-bar.wait{background:var(--sky-50);border-color:var(--sky-200);color:var(--sky-700);}
  .sync-bar.wait .d{background:var(--sky-400);}
  .sync-bar.off{background:#f4f6f8;border-color:#dfe5ea;color:var(--muted);}
  .sync-bar.off .d{background:var(--muted);}
  .sdot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .sdot.ok{background:var(--ok);} .sdot.wait{background:var(--warn);}

  .ovl{position:absolute;inset:0;background:rgba(12,39,64,.55);display:flex;align-items:flex-end;justify-content:center;z-index:80;padding:14px;}
  .sheet{width:100%;background:var(--white);border-radius:22px;padding:20px 18px 18px;box-shadow:var(--sh-lg);animation:rise .22s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow-y:auto;}
  @keyframes rise{from{transform:translateY(28px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{font:600 19px/1.2 var(--disp);margin-bottom:8px;}
  .sheet p{font:400 12.8px/1.5 var(--body);color:var(--muted);margin-bottom:13px;}
  .sheet .acts{display:flex;gap:9px;margin-top:14px;}
  .sheet .acts .btn{flex:1;}
  .spin{width:34px;height:34px;border:3px solid var(--sky-100);border-top-color:var(--sky-500);border-radius:50%;animation:sp .8s linear infinite;margin:6px auto 14px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .gps-ok{font:600 12.5px var(--body);color:var(--ok);background:var(--ok-bg);border:1px solid #bfe6d6;border-radius:10px;padding:10px 12px;}

  .ver{text-align:center;font:500 10px/1.4 var(--body);color:var(--muted);margin-top:12px;letter-spacing:.02em;}
  .toast{position:absolute;left:50%;bottom:94px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font:500 12.5px var(--body);padding:11px 17px;border-radius:12px;box-shadow:var(--sh-md);opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:88%;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* Registrar IDs keep their original shape — HHR + a number — and are handed
   out by walking the tree once (district, chiefdom, PHU, registrar), so every
   ID in the country is unique and belongs to exactly one PHU. The PHU's own
   location code (BO-03-007) is shown while drilling down, but it never enters
   an HHR ID, a token or a record key. */
const pad=(n,w)=>String(n).padStart(w,'0');
const HHR_PAD=5;                        /* HHR00001 … HHR03130 */
function hhrId(seq){ return 'HHR'+pad(seq,HHR_PAD); }
const HHRS=[], HHR_BY_ID={}, HHR_AT={};
(function buildRegistrars(){
  let seq=0;
  HIER.forEach((d,di)=>d[2].forEach((c,ci)=>c[1].forEach((phu,pi)=>{
    for(let hi=0;hi<HHR_PER_PHU;hi++){
      const rec={id:hhrId(++seq), seq:seq, di:di, ci:ci, pi:pi, hi:hi, n:hi+1,
                 district:d[1], districtCode:d[0], chiefdom:c[0], phu:phu,
                 phuCode:d[0]+'-'+pad(ci+1,2)+'-'+pad(pi+1,3)};
      HHRS.push(rec); HHR_BY_ID[rec.id]=rec; HHR_AT[di+':'+ci+':'+pi+':'+hi]=rec;
    }
  })));
})();
/* from an ID back to the PHU it belongs to, or null if it is not a real ID */
function hhrPlace(id){ return HHR_BY_ID[String(id||'').toUpperCase()]||null; }
function hhrAt(di,ci,pi,hi){ return HHR_AT[di+':'+ci+':'+pi+':'+hi]||null; }
function hhrCount(){ return HHRS.length; }
function phuCount(){ return HIER.reduce((s,d)=>s+d[2].reduce((t,c)=>t+c[1].length,0),0); }
/* HHR ID typed loosely — "27", "hhr 27", "HHR0027" — normalised to the padded
   form, or null if it is not one of ours. */
function normId(raw){
  let s=String(raw||'').trim().toUpperCase().replace(/[\s\-_]/g,'');
  s=s.replace(/^HHR/,'');
  if(!s||!/^\d+$/.test(s)) return null;
  const n=parseInt(s,10);
  if(!n||n<1||n>hhrCount()) return null;
  return hhrId(n);
}

/* =========================================================
   HHR DIRECTORY — communities, HHR name and telephone per HHR ID,
   loaded from hhr_directory.csv sitting next to this file (columns:
   HHRID, District, Chiefdom, PHU, Communities, FirstName, LastName,
   Phone — Communities is a semicolon-separated list). District,
   Chiefdom and PHU come from HIER above and are only repeated in the
   CSV as a check when someone is filling it in.
   The CSV is mandatory. The application must not open unless this file
   is successfully loaded at startup. No cached fallback is used. */
const DIR_URL='hhr_directory.csv';
let DIR={};
function splitCsvLine(l){
  const out=[]; let cur='', q=false;
  for(let i=0;i<l.length;i++){
    const c=l[i];
    if(c==='"'){ q=!q; continue; }
    if(c===','&&!q){ out.push(cur); cur=''; continue; }
    cur+=c;
  }
  out.push(cur);
  return out;
}
function parseDirectory(txt){
  const lines=String(txt||'').split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) throw new Error('Empty HHR directory');
  const header=splitCsvLine(lines[0]).map(h=>h.trim().toLowerCase());
  const col=k=>header.indexOf(k);
  const iId=col('hhrid'), iCom=col('communities'), iF=col('firstname'), iL=col('lastname'), iP=col('phone');
  if(iId<0 || iCom<0 || iF<0 || iL<0 || iP<0) throw new Error('Invalid HHR directory columns');
  const out={};
  for(let i=1;i<lines.length;i++){
    const c=splitCsvLine(lines[i]);
    const id=normId((c[iId]||'').trim());
    if(!id) continue;
    out[id]={
      communities:(iCom>-1?(c[iCom]||''):'').split(';').map(s=>s.trim()).filter(Boolean),
      first:(iF>-1?(c[iF]||''):'').trim(),
      last:(iL>-1?(c[iL]||''):'').trim(),
      phone:(iP>-1?(c[iP]||''):'').trim()
    };
  }
  DIR=out;
}
function dirFor(id){ return DIR[id]||null; }
function loadDirectory(cb){
  let settled=false;
  const finish=ok=>{ if(settled) return; settled=true; cb&&cb(ok); };
  const ctrl=('AbortController' in window)?new AbortController():null;
  const t=setTimeout(()=>{ try{ ctrl&&ctrl.abort(); }catch(e){} },6000);
  try{
    fetch(DIR_URL,ctrl?{signal:ctrl.signal,cache:'no-store'}:{cache:'no-store'}).then(r=>r.ok?r.text():Promise.reject(r.status)).then(txt=>{
      clearTimeout(t);
      parseDirectory(txt);
      if(!Object.keys(DIR).length) throw new Error('HHR directory contains no valid records');
      finish(true);
    }).catch(()=>{
      clearTimeout(t);
      DIR={};
      finish(false);
    });
  }catch(e){ clearTimeout(t); finish(false); }
}

/* ---------- storage ---------- */
const Store=(()=>{let ok=false,mem={};try{localStorage.setItem('__t','1');localStorage.removeItem('__t');ok=true;}catch(e){}
 return{get(k,d){if(ok){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}return k in mem?mem[k]:d;},
        set(k,v){if(ok){try{localStorage.setItem(k,JSON.stringify(v));return;}catch(e){}}mem[k]=v;},
        del(k){if(ok){try{localStorage.removeItem(k);return;}catch(e){}}delete mem[k];}};})();
const SESS_KEY='itn_hhr_session_v1';
const URL_KEY='itn_hhr_gas_url_v1';
const recKey=id=>'itn_hhr_done_'+id;

/* done[day][hh] = true. Kept per HHR so each login sees only its own work. */
GAS_URL=Store.get(URL_KEY,GAS_URL)||GAS_URL;
let me=Store.get(SESS_KEY,null);      /* the HHR currently logged in */
let meCommunity='', meFirst='', meLast='', mePhone='';   /* set at sign-in, on every record */
let done={};
function loadDone(){ done = me ? Store.get(recKey(me),{}) : {}; loadRecs(); trackLoad(); }
function saveDone(){ if(me) Store.set(recKey(me),done); }
function isDone(d,h){ return !!(done[d]&&done[d][h]); }
function setDone(d,h,v){
  if(!done[d]) done[d]={};
  if(v) done[d][h]=true; else delete done[d][h];
  saveDone();
}
/* the answers themselves, per HHR: rec['d1h1'] = {...} */
let recs={};
function loadRecs(){ recs = me ? Store.get('itn_hhr_recs_'+me,{}) : {}; }
function saveRecs(){ if(me) Store.set('itn_hhr_recs_'+me,recs); }
function recKeyOf(d,h){ return 'd'+d+'h'+h; }
function recGet(d,h){ return recs[recKeyOf(d,h)]||null; }
function recSet(d,h,v){ recs[recKeyOf(d,h)]=v; saveRecs(); }
/* A record is `unsent` before its first successful submission and `changed`
   after an edit. Both mean the same thing to the sender: push it again. */
function needsSend(r){ return !!r && (!r._submitted || !!r._dirty); }
function isRevisit(r){ return !!r && r._status==='Revisit'; }
function revisitCount(d){ let n=0; for(let h=1;h<=PER_DAY;h++) if(isRevisit(recGet(d,h))) n++; return n; }
function revisitTotal(){ let n=0; for(let d=1;d<=DAYS;d++) n+=revisitCount(d); return n; }
function dayRecs(d){ const out=[]; for(let h=1;h<=PER_DAY;h++){ const r=recGet(d,h); if(r) out.push(r); } return out; }
function dayToSend(d){ return dayRecs(d).filter(needsSend); }
function daySubmitted(d){ return dayComplete(d) && dayToSend(d).length===0; }
function dayChanged(d){ return dayComplete(d) && dayRecs(d).some(r=>r._submitted&&r._dirty); }

function dayCount(d){ let n=0; for(let h=1;h<=PER_DAY;h++) if(isDone(d,h)) n++; return n; }
function dayComplete(d){ return dayCount(d)===PER_DAY; }
function totalDone(){ let n=0; for(let d=1;d<=DAYS;d++) n+=dayCount(d); return n; }

/* ---------- the two locking rules ----------
   1. Household h opens only when household h-1 in the same day is complete.
   2. Day d opens only when every household in day d-1 is complete. */
function dayOpen(d){ return d===1 || dayComplete(d-1); }
function hhOpen(d,h){
  if(!dayOpen(d)) return false;
  if(isDone(d,h)) return true;          /* already registered — always viewable */
  return h===1 || isDone(d,h-1);
}
function nextHH(d){ for(let h=1;h<=PER_DAY;h++) if(!isDone(d,h)) return h; return null; }
function currentDay(){ for(let d=1;d<=DAYS;d++) if(!dayComplete(d)) return d; return DAYS; }

/* =========================================================
   SENDING — one record per call, JSONP so it works from a phone
   without CORS. The server upserts on _id.
   ========================================================= */
function sendRec(rec,cb){
  if(!GAS_URL){ cb(false,'no-url'); return; }
  const fn='__s'+Date.now()+Math.floor(Math.random()*1e4); let done=false;
  const el=document.createElement('script');
  window[fn]=r=>{ done=true; delete window[fn]; el.remove();
    cb(!!(r&&(r.status==='ok'||r.status==='updated')), r&&r.status); };
  el.onerror=()=>{ if(done) return; delete window[fn]; el.remove(); cb(false,'network'); };
  el.src=GAS_URL+(GAS_URL.indexOf('?')>-1?'&':'?')+'data='+encodeURIComponent(JSON.stringify(rec))
        +'&callback='+fn+'&t='+Date.now();
  document.body.appendChild(el);
  setTimeout(()=>{ if(!done){ try{delete window[fn]; el.remove();}catch(e){} cb(false,'timeout'); } },20000);
}
function setGAS(){
  const v=prompt('Paste the NMDR submission URL (ends with /exec):',GAS_URL||'');
  if(v===null) return;
  const t=v.trim();
  if(t&&t.indexOf('script.google.com')===-1){ toast('That does not look like a /exec URL'); return; }
  GAS_URL=t; Store.set(URL_KEY,t); toast(t?'NMDR connected':'Disconnected'); renderDays();
}

   The GitHub hhr_directory.csv is the source of truth for the signed-in HHR;

   editable on the household form. */

  const d=dirFor(me)||{};

  meFirst=d.first!=null&&String(d.first).trim()?String(d.first).trim():(saved.first||'');
  meLast=d.last!=null&&String(d.last).trim()?String(d.last).trim():(saved.last||'');
  mePhone=d.phone!=null&&String(d.phone).trim()?String(d.phone).trim():(saved.phone||'');

function saveIdentityFromForm(){
  const first=(document.getElementById('hhrFirst')||{}).value?.trim()||'';
  const last=(document.getElementById('hhrLast')||{}).value?.trim()||'';

/* Everything on the device that still has to reach NMDR, in day order. */
function allToSend(){
  const out=[];
  for(let d=1;d<=DAYS;d++) dayToSend(d).forEach(r=>out.push(r));
  return out;
}
/* Records are saved first and sent when they can be. This pushes whatever is
   waiting: on load, when the browser comes back online, when the app returns to
   the foreground, and once a minute as a safety net. */
let autoBusy=false;
function autoSync(cb){
  if(autoBusy||!GAS_URL||!navigator.onLine){ cb&&cb(0); return; }
  const q=allToSend();
  if(!q.length){ cb&&cb(0); return; }
  autoBusy=true;
  let i=0, sent=0;
  const step=()=>{
    if(i>=q.length){
      autoBusy=false; saveRecs();
      if(sent) refreshAfterSync();
      cb&&cb(sent); return;
    }
    const rec=q[i];
    sendRec(rec,(ok,status)=>{
      if(ok){ rec._submitted=true; rec._dirty=false; rec._submittedAt=new Date().toISOString(); sent++; }
      else rec._lastError=status||'failed';
      saveRecs(); i++;
      if(!ok&&!navigator.onLine){ autoBusy=false; cb&&cb(sent); return; }
      setTimeout(step,250);
    });
  };
  step();
}
/* only redraw a screen that is actually showing sync state */
function refreshAfterSync(){
  if(document.querySelector('.sync-bar')){
    if(document.querySelector('.dayrow')) renderAchv();
    else if(document.querySelector('.grid.g4')) renderDay(formD||currentDay());
    else if(document.querySelector('.menu-card')) renderMenu();
  }
}
window.addEventListener('online',()=>{ toast('Back online \u2014 sending what is waiting'); autoSync(n=>{ if(n) toast(n+' record'+(n===1?'':'s')+' sent to NMDR'); }); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) autoSync(); });
setInterval(()=>autoSync(),60000);

/* Days finished but not yet in NMDR. */
function outstandingDays(){
  const out=[]; for(let d=1;d<=DAYS;d++) if(dayComplete(d)&&dayToSend(d).length) out.push(d);
  return out;
}
function outBar(){
  if(!GAS_URL) return `<div class="sync-bar off"><span class="d"></span>
    <div class="t"><b>Not connected to NMDR.</b> Records stay on this device until the connection is set.</div>
    <button class="btn btn-ghost btn-sm" style="flex:0 0 auto" onclick="setGAS()">Connect</button></div>`;
  const o=outstandingDays();
  if(!o.length) return `<div class="sync-bar ok"><span class="d"></span>
    <div class="t"><b>Nothing waiting.</b> Every finished day is in NMDR.</div></div>`;
  return `<div class="sync-bar warn"><span class="d"></span>
    <div class="t"><b>Day ${o.join(', Day ')} not submitted.</b><br>Open the day and submit its records.</div></div>`;
}



/* =========================================================
   TARGET AND ACHIEVEMENT
   ---------------------------------------------------------
   Target is fixed by the workload: 25 households a day, 10 days,
   250 in all. Achievement is what has been registered, with the
   part that has reached NMDR shown separately from the part
   still sitting on the phone.
   ========================================================= */
function achvDay(d){
  const rs=dayRecs(d);
  const sent=rs.filter(r=>r._submitted&&!r._dirty).length;
  return {
    d:d, target:PER_DAY, done:dayCount(d), sent:sent, pending:rs.length-sent,
    open:dayOpen(d),
    people:rs.reduce((s,r)=>s+(Number(r.size)||0),0),
    itns:rs.reduce((s,r)=>s+(Number(r.itns)||0),0),
    u5:rs.reduce((s,r)=>s+(Number(r.u5)||0),0)
  };
}
function achvAll(){
  const days=[]; for(let d=1;d<=DAYS;d++) days.push(achvDay(d));
  const sum=k=>days.reduce((s,x)=>s+x[k],0);
  return {days:days, target:DAYS*PER_DAY, done:sum('done'), sent:sum('sent'), pending:sum('pending'),
          people:sum('people'), itns:sum('itns'), u5:sum('u5'),
          daysDone:days.filter(x=>x.done===PER_DAY).length};
}

      <circle cx="64" cy="64" r="${R}" fill="none" stroke="${colour}" stroke-width="15" stroke-linecap="round"
        stroke-dasharray="${on.toFixed(1)} ${(C-on).toFixed(1)}" transform="rotate(-90 64 64)"/>
    </svg>
